
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK EARN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 SK EARN</h1>
    <p>Earn • Learn • Track</p>
  </header>

  <main>
    <section class="card">
      <h2>📱 Phone Login</h2>
      <input id="phone" type="tel" placeholder="+91 Mobile Number">
      <div id="recaptcha-container"></div>
      <button id="sendOtp">Send OTP</button>

      <input id="otp" type="text" inputmode="numeric"
        placeholder="Enter OTP" maxlength="6">
      <button id="verifyOtp">Verify OTP</button>
      <p id="loginStatus">Login करण्यासाठी मोबाइल नंबर टाका.</p>
    </section>

    <section class="card">
      <h2>👛 My Wallet</h2>
      <p>Available balance</p>
      <h1 id="balance">₹0.00</h1>
      <button id="refreshWallet">Refresh Wallet</button>
    </section>

    <section class="card">
      <h2>🏦 UPI Withdrawal</h2>
      <input id="amount" type="number" min="1"
        placeholder="Amount in ₹">
      <input id="upi" type="text" placeholder="Your UPI ID">
      <button id="withdraw">Request Withdrawal</button>
      <p id="withdrawStatus"></p>
    </section>

    <section class="card">
      <h2>📜 Transactions</h2>
      <button id="loadTransactions">Load History</button>
      <ul id="transactions"></ul>
    </section>
  </main>

  <footer>SK EARN © 2026</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
